name: Deploy static directory to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'app/globals.css'
      - 'components/**'
      - 'content/rules/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-static-directory
  cancel-in-progress: false

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export published Firestore rules
        run: npm run export:directory -- --require-firestore
      - name: Build static site
        run: npx next build
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy out --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
